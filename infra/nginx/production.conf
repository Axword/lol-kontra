# This listener is published only on the host's loopback interface. An external
# TLS proxy must overwrite X-Forwarded-Proto and preserve the public Host header.
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 10m;

    location ~ ^/(api|admin)(/|$) {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    }

    location /static/ {
        alias /app/staticfiles/;
        add_header X-Content-Type-Options nosniff always;
    }

    location /media/ {
        alias /app/media/;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
