# Standalone production definition: do not merge with docker-compose.yml.
# Requires a separate production env file and an external HTTPS reverse proxy.
# The proxy must preserve Host and overwrite X-Forwarded-Proto with https.
name: worlds-xi-prod

x-backend: &backend
  image: ${BACKEND_IMAGE:-kontra-backend:production}
  build:
    context: ./backend
    dockerfile: Dockerfile.prod
  entrypoint: []
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  environment: &backend-environment
    DJANGO_SETTINGS_MODULE: config.settings
    DJANGO_DEBUG: "false"
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a unique production Django secret of at least 50 characters}
    DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set explicit production hostnames}
    DJANGO_TRUST_PROXY_HEADERS: "true"
    POSTGRES_DB: ${POSTGRES_DB:?Set the production database name}
    POSTGRES_USER: ${POSTGRES_APP_USER:?Set a separate runtime database role}
    POSTGRES_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set a unique runtime database password}
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
    CELERY_RESULT_BACKEND: redis://redis:6379/2
    DAILY_TIMEZONE: ${DAILY_TIMEZONE:-Europe/Warsaw}
    CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
    SENTRY_DSN: ${SENTRY_DSN:-}
  networks: [backend, edge]

x-app: &app
  <<: *backend
  depends_on:
    release:
      condition: service_completed_successfully
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: ${POSTGRES_IMAGE:-kontra-postgres:production}
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set the production database name}
      POSTGRES_USER: ${POSTGRES_USER:?Set the database migration owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database owner password}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?Set a separate runtime database role}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set a unique runtime database password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - prod_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - prod_redisdata:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]
    restart: unless-stopped

  release:
    <<: *backend
    # Explicit release step; runtime services never execute migrations or seeds.
    command: [/bin/sh, -ec, "python manage.py bootstrap_database && python manage.py collectstatic --noinput"]
    environment:
      <<: *backend-environment
      POSTGRES_USER: ${POSTGRES_USER:?Set the database migration owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique database owner password}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?Set a separate runtime database role}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?Set a unique runtime database password}
    volumes:
      - prod_staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  backup:
    profiles: [maintenance]
    image: ${POSTGRES_IMAGE:-kontra-postgres:production}
    build:
      context: ./infra/postgres
      dockerfile: Dockerfile.prod
    entrypoint: [/bin/sh, /opt/backup.sh]
    command: []
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set the production database name}
      POSTGRES_USER: ${POSTGRES_USER:?Set the database migration owner}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      PGHOST: db
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set a unique database owner password}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    restart: "no"

  api:
    <<: *app
    command: [gunicorn, config.wsgi:application, --bind, "0.0.0.0:8000", --workers, "3", --timeout, "60", --access-logfile, "-", --error-logfile, "-"]
    volumes:
      - prod_media:/app/media

  worker:
    <<: *app
    command: [celery, -A, config, worker, -l, info]

  beat:
    <<: *app
    command: [celery, -A, config, beat, -l, info, --pidfile=/tmp/celerybeat.pid, --scheduler, "django_celery_beat.schedulers:DatabaseScheduler"]

  frontend:
    image: ${FRONTEND_IMAGE:-kontra-frontend:production}
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:uid=1001,gid=1001,mode=0755
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_started
    networks: [edge]
    restart: unless-stopped

  nginx:
    image: ${NGINX_IMAGE:-kontra-nginx:production}
    build:
      context: ./infra/nginx
      dockerfile: Dockerfile.prod
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
    volumes:
      - prod_staticfiles:/app/staticfiles:ro
      - prod_media:/app/media:ro
    depends_on: [frontend, api]
    networks: [edge]
    restart: unless-stopped

networks:
  backend:
    internal: true
  edge:

volumes:
  prod_pgdata:
  prod_redisdata:
  prod_staticfiles:
  prod_media:
