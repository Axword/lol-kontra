# ---------------------------------------------------------------------------
# Worlds XI – uruchomienie aplikacji
#
# Gra nie ma backendu: baza zawodników i codzienne zagadki są generowane do
# statycznych plików JSON podczas budowania obrazu. Nie ma tu bazy danych,
# Redisa, workerów ani zmiennych środowiskowych do ustawienia.
#
#   docker compose up --build        -> http://localhost:3000
#
# Stary stos (Django + PostgreSQL + Redis + Celery + nginx) leży w
# docker-compose.legacy.yml. Nie jest potrzebny do działania gry.
# ---------------------------------------------------------------------------

services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: worlds-xi:latest
    container_name: worlds-xi
    ports:
      - "${PORT:-3000}:3000"
    restart: unless-stopped
    # Obraz uruchamia się jako użytkownik bez uprawnień roota i nie zapisuje
    # niczego na dysku – cały stan gry siedzi w localStorage przeglądarki.
    read_only: true
    tmpfs:
      - /tmp
      # Next zapisuje tu cache renderowania na żądanie – przy systemie plików
      # tylko do odczytu bez tego katalogu serwer wywala się przy pierwszym
      # wejściu na /daily/<id>.
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
